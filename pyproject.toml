[project]
name = "pm-dash"
version = "0.1.0"
description = "Project Manager Dashboard: a one-user tracker that answers 'will this project pass its next gate?'"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "httpx>=0.27",
]

[project.scripts]
pm-dash = "pmd.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pmd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
